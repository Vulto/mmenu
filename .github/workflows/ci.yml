name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmenu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-dev valgrind shellcheck
      - name: Compile with strict diagnostics
        id: compile
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          if [ "${{ matrix.mode }}" = sanitizers ]; then
            CFLAGS="-O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -fno-omit-frame-pointer -fsanitize=address,undefined"
          else
            CFLAGS="-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror"
          fi
          $CC $CFLAGS -D_DEFAULT_SOURCE -o build/mmenu main.c -lncursesw
          $CC $CFLAGS -D_DEFAULT_SOURCE -o build/api-test tests/apiHarness.c -lncursesw
      - name: Shell test lint
        run: shellcheck tests/cli.sh tests/interactive.sh tests/benchmark.sh tests/performance-regression.sh
      - name: GCC static analyzer
        if: always() && matrix.compiler == 'gcc' && matrix.mode == 'release' && steps.compile.outcome == 'success'
        run: gcc -O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -fanalyzer -D_DEFAULT_SOURCE -o build/mmenu-analyzer main.c -lncursesw
      - name: CLI regression suite
        run: sh tests/cli.sh build/mmenu
      - name: Interactive C API regression suite
        if: always() && steps.compile.outcome == 'success'
        run: sh tests/interactive.sh build/api-test
      - name: Valgrind memory checks
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: |
          valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=all build/mmenu --filter needle < tests/fixtures/basic.txt > /dev/null
          printf '\n' | TERM=xterm script -q -e -c 'valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=all build/api-test' /dev/null > /dev/null
      - name: Performance measurements
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: sh tests/benchmark.sh build/mmenu build/performance.csv
      - name: Compare performance against base revision
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base revision for this event; benchmark artifact remains available."
            exit 0
          fi
          BaselineDir="$RUNNER_TEMP/mmenu-baseline-src"
          BaselineBin="$RUNNER_TEMP/mmenu-baseline-bin"
          git worktree add --detach "$BaselineDir" "$BASE_SHA"
          gcc -O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -D_DEFAULT_SOURCE -o "$BaselineBin" "$BaselineDir/main.c" -lncursesw
          sh tests/performance-regression.sh "$BaselineBin" build/mmenu build/performance-regression.csv
      - name: Upload performance results
        if: always() && matrix.compiler == 'gcc' && matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mmenu-performance-${{ github.sha }}
          path: build/*.csv
          if-no-files-found: ignore
