name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmenu-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        env:
          EventName: ${{ github.event_name }}
          BeforeSha: ${{ github.event.before }}
          BaseSha: ${{ github.event.pull_request.base.sha }}
          HeadSha: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EventName" = "pull_request" ]; then
            Base="$BaseSha"
          elif [ "$EventName" = "push" ]; then
            Base="$BeforeSha"
            if [ "$Base" = "0000000000000000000000000000000000000000" ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            Base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          ChangedFiles="$(git diff --name-only "$Base" "$HeadSha")"
          CodeChanged=false
          while IFS= read -r Path; do
            [ -n "$Path" ] || continue
            case "$Path" in
              *.md|docs/*) ;;
              *) CodeChanged=true; break ;;
            esac
          done <<EOF
          $ChangedFiles
          EOF
          echo "code=$CodeChanged" >> "$GITHUB_OUTPUT"
          echo "Code changes detected: $CodeChanged"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ncurses-dev valgrind shellcheck time fzf fzy curl xz-utils groff
      - name: Compile with strict diagnostics
        id: compile
        env:
          CC: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          if [ "${{ matrix.mode }}" = sanitizers ]; then
            CFLAGS="-O1 -g -std=c2x -Wall -Wextra -Wpedantic -Werror -fno-omit-frame-pointer -fsanitize=address,undefined"
          else
            CFLAGS="-O2 -g -std=c2x -Wall -Wextra -Wpedantic -Werror"
          fi
          $CC $CFLAGS -D_DEFAULT_SOURCE -o build/mmenu main.c -lncursesw
          $CC $CFLAGS -D_DEFAULT_SOURCE -o build/input-capacity-test tests/input-capacity.c -lncursesw
          $CC $CFLAGS -D_DEFAULT_SOURCE -o build/api-test tests/apiHarness.c -lncursesw
          $CC $CFLAGS -D_DEFAULT_SOURCE -Dmalloc=TestMalloc -Drealloc=TestRealloc -c tests/apiHarness.c -o build/apiHarness-allocfail.o
          $CC $CFLAGS -c tests/allocFail.c -o build/allocFail-api.o
          $CC $CFLAGS -o build/api-test-allocfail build/apiHarness-allocfail.o build/allocFail-api.o -lncursesw
          $CC $CFLAGS -D_DEFAULT_SOURCE -Dmalloc=TestMalloc -Drealloc=TestRealloc -c main.c -o build/main-allocfail.o
          $CC $CFLAGS -c tests/allocFail.c -o build/allocFail.o
          $CC $CFLAGS -o build/mmenu-allocfail build/main-allocfail.o build/allocFail.o -lncursesw
      - name: C23 language-mode smoke build
        if: matrix.mode == 'release' && steps.compile.outcome == 'success'
        env:
          CC: ${{ matrix.compiler }}
        run: sh tests/c23-smoke.sh
      - name: Install pinned skim reference binary
        if: matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: |
          set -eu
          SkimDir="$RUNNER_TEMP/skim-v5.7.4"
          Asset="skim-x86_64-unknown-linux-gnu.tar.xz"
          mkdir -p "$SkimDir"
          curl -fsSL "https://github.com/skim-rs/skim/releases/download/v5.7.4/$Asset" -o "$SkimDir/$Asset"
          curl -fsSL "https://github.com/skim-rs/skim/releases/download/v5.7.4/$Asset.sha256" -o "$SkimDir/$Asset.sha256"
          (cd "$SkimDir" && sha256sum -c "$Asset.sha256")
          tar -xJf "$SkimDir/$Asset" -C "$SkimDir"
          SkimBin=$(find "$SkimDir" -type f -name sk -perm /111 -print -quit)
          test -n "$SkimBin"
          install -m 0755 "$SkimBin" "$RUNNER_TEMP/sk"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Shell test lint
        run: shellcheck tests/cli.sh tests/interactive.sh tests/benchmark.sh tests/performance-regression.sh tests/allocation-failure.sh tests/allocation-sweep.sh tests/ranking-baseline.sh tests/release-check.sh tests/interactive-benchmark.sh tests/matcher-throughput.sh tests/c23-smoke.sh tests/build-driver.sh tests/streaming.sh
      - name: Clean release smoke and public-header build
        if: always() && steps.compile.outcome == 'success'
        env:
          CC: ${{ matrix.compiler }}
        run: sh tests/release-check.sh
      - name: Man page and build-driver regression
        if: always() && steps.compile.outcome == 'success'
        env:
          CC: ${{ matrix.compiler }}
        run: sh tests/build-driver.sh
      - name: GCC static analyzer
        if: always() && matrix.compiler == 'gcc' && matrix.mode == 'release' && steps.compile.outcome == 'success'
        run: gcc -O2 -g -std=c2x -Wall -Wextra -Wpedantic -Werror -fanalyzer -D_DEFAULT_SOURCE -o build/mmenu-analyzer main.c -lncursesw
      - name: Input capacity overflow regression
        if: always() && steps.compile.outcome == 'success'
        run: build/input-capacity-test
      - name: CLI regression suite
        if: always() && steps.compile.outcome == 'success'
        run: sh tests/cli.sh build/mmenu
      - name: Interactive C API regression suite
        if: always() && steps.compile.outcome == 'success'
        run: sh tests/interactive.sh build/api-test build/api-test-allocfail
      - name: Streaming input regression suite
        if: always() && steps.compile.outcome == 'success'
        run: sh tests/streaming.sh build/mmenu
      - name: Ranking-quality baseline
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: sh tests/ranking-baseline.sh build/mmenu build/ranking-baseline.csv
      - name: Coverage-guided matcher fuzzing
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'clang' && matrix.mode == 'sanitizers'
        env:
          LC_ALL: C.UTF-8
        run: |
          clang -O1 -g -std=c2x -Wall -Wextra -Wpedantic -Werror -fno-omit-frame-pointer -fsanitize=fuzzer,address,undefined -D_DEFAULT_SOURCE -o build/fuzz-matcher tests/fuzz/matcher.c -lncursesw
          timeout 45s build/fuzz-matcher -max_total_time=15 -max_len=8192 -print_final_stats=1 tests/fuzz/corpus
      - name: Allocation-failure injection
        if: always() && steps.compile.outcome == 'success'
        run: sh tests/allocation-failure.sh build/mmenu-allocfail
      - name: Exhaustive allocation-failure sweeps
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'sanitizers'
        run: sh tests/allocation-sweep.sh build/mmenu-allocfail build/api-test-allocfail
      - name: Valgrind memory checks
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: |
          valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=all build/mmenu --filter needle < tests/fixtures/basic.txt > /dev/null
          printf '\n' | TERM=xterm script -q -e -c 'valgrind --quiet --error-exitcode=99 --leak-check=full --show-leak-kinds=all build/api-test' /dev/null > /dev/null
      - name: Performance measurements
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        env:
          CC: gcc
          BENCHMARK_CFLAGS: -O2 -g -std=c2x -Wall -Wextra -Wpedantic -Werror -D_DEFAULT_SOURCE
        run: sh tests/benchmark.sh build/mmenu build/performance.csv
      - name: Matcher throughput measurements
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        env:
          CC: gcc
        run: sh tests/matcher-throughput.sh build/mmenu build/matcher-throughput.csv
      - name: Interactive first-paint measurements
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        run: sh tests/interactive-benchmark.sh build/mmenu build/interactive-first-paint.csv
      - name: Compare performance against base revision
        if: always() && steps.compile.outcome == 'success' && matrix.compiler == 'gcc' && matrix.mode == 'release'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base revision for this event; benchmark artifact remains available."
            exit 0
          fi
          BaselineDir="$RUNNER_TEMP/mmenu-baseline-src"
          BaselineBin="$RUNNER_TEMP/mmenu-baseline-bin"
          git worktree add --detach "$BaselineDir" "$BASE_SHA"
          gcc -O2 -g -std=c2x -Wall -Wextra -Wpedantic -Werror -D_DEFAULT_SOURCE -o "$BaselineBin" "$BaselineDir/main.c" -lncursesw
          sh tests/performance-regression.sh "$BaselineBin" build/mmenu build/performance-regression.csv
      - name: Upload performance results
        if: always() && matrix.compiler == 'gcc' && matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mmenu-performance-${{ github.sha }}
          path: |
            build/*.csv
            build/*.txt
          if-no-files-found: ignore
